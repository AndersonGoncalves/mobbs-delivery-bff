services:
  api:
    image: ghcr.io/andersongoncalves/mobbs-delivery-bff:${IMAGE_TAG:-latest}
    restart: always
    # 2026-10-21 — a EC2 (t3.micro, 908MiB de RAM, sem swap até então) travou por completo (não só
    # o container: systemd/journald/snapd pararam de responder aos próprios watchdogs, nginx teve
    # workers mortos por SIGKILL — assinatura clássica do OOM-killer do kernel) depois de um pico
    # de memória sem teto nenhum. `mem_limit` contém qualquer vazamento/pico a ESTE container
    # (vira um restart isolado via `restart: always`, não um travamento do host inteiro). Ver
    # também o swapfile de 2GB adicionado na instância (fora deste repo, `/etc/fstab`).
    mem_limit: 300m
    ports: ["3001:3001"]
    environment:
      - DB_URL=mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongo:27017/mobbs-delivery?authSource=admin
      # specs/0106 — e-mails (separados por vírgula) com acesso ao painel da plataforma (/plataforma).
      - PLATFORM_ADMIN_EMAILS=${PLATFORM_ADMIN_EMAILS}
      # specs/0023-portabilidade-dados — SMTP para o e-mail de exportação de dados (LGPD). Sem estas
      # variáveis o envio falha em silêncio (só aparece no log) e o cliente recebe a confirmação mesmo assim.
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      # specs/0112 REQ-9 — chave de criptografia da chave Pix do cliente (32 bytes em base64). Sem ela, a função falha.
      - PIX_KEY_ENCRYPTION_KEY=${PIX_KEY_ENCRYPTION_KEY}
      # specs/0123-prospeccao-restaurantes-google-maps — chave de SERVIDOR (Places API New). Sem ela,
      # a busca de prospects lança erro claro (REQ-8), o resto do BFF continua funcionando normalmente.
      - GOOGLE_PLACES_API_KEY=${GOOGLE_PLACES_API_KEY}
      # specs/0101-integracao-asaas — chave da conta MÃE/plataforma (cria subcontas por
      # restaurante, nunca a chave de um restaurante específico). Sem ela, o cadastro de
      # subconta falha com erro claro (AsaasOnboardingController). O valor em `.env` precisa
      # escapar `$` como `$$` (sintaxe de interpolação do Compose) — achado real 2026-10-22: um
      # token Asaas começa com `$` literal, e sem escapar o Compose tentava resolvê-lo como
      # variável e mandava string vazia pro container, sem erro nenhum visível.
      - ASAAS_API_KEY=${ASAAS_API_KEY}
      # Default já é sandbox no código (`environment.ts`) se isto ficar vazio — só precisa virar
      # a URL de produção (`https://api.asaas.com/v3`) quando a conta mãe virar uma PJ real.
      - ASAAS_BASE_URL=${ASAAS_BASE_URL}
      # Achado real (03/11/2026) — estas 4 variáveis já existiam no `.env`/`.env.example` mas
      # nunca tinham sido adicionadas aqui; o Compose só repassa pro container o que está
      # explicitamente listado nesta seção, não tudo que está no `.env`. Sem isso, a cobrança da
      # assinatura (specs/0175) ficava sem efeito mesmo com o `.env` preenchido, sem erro nenhum
      # visível — mesma classe de bug do achado do `ASAAS_API_KEY` escapado acima.
      - BILLING_PIX_KEY_TYPE=${BILLING_PIX_KEY_TYPE}
      - BILLING_PIX_KEY=${BILLING_PIX_KEY}
      - BILLING_PIX_BENEFICIARY_NAME=${BILLING_PIX_BENEFICIARY_NAME}
      - ASAAS_BILLING_WEBHOOK_TOKEN=${ASAAS_BILLING_WEBHOOK_TOKEN}
      # Achado de auditoria pré-produção (01/11/2026) — monitoramento de erro (Sentry); mesmo
      # motivo acima, precisa estar listado aqui pra chegar no container. Vazio = desligado.
      - SENTRY_DSN=${SENTRY_DSN}
      # Firebase Admin SDK (verificação dos tokens do app) — chave de service account baixada no
      # Console (Configurações do projeto > Contas de serviço > Gerar nova chave privada), salva
      # como ./firebase-service-account.json (mesma pasta deste arquivo, já no .gitignore).
      - GOOGLE_APPLICATION_CREDENTIALS=/app/firebase-service-account.json
      # specs/0121-integracao-uber-entregas — pedido explícito do usuário (10/11/2026): precisa
      # estar listado aqui pra chegar no container (mesma classe de bug do achado do
      # BILLING_PIX_KEY_TYPE acima). Ativa o Robo Courier (entregador simulado da Uber) só nas
      # entregas despachadas com credenciais da conta "Testando" (sandbox) — ver
      # `uber-direct-client.ts`/`docs/UBER-DIRECT.md`. Manter "false" no `.env` do servidor fora
      # de janelas de teste explicitamente combinadas; `${UBER_DIRECT_TEST_MODE}` vazio também
      # resolve pra "false" (checagem `=== 'true'` em `environment.ts`).
      - UBER_DIRECT_TEST_MODE=${UBER_DIRECT_TEST_MODE}
    volumes:
      - ./firebase-service-account.json:/app/firebase-service-account.json:ro
    depends_on:
      mongo:
        condition: service_healthy

  mongo:
    image: mongo:7
    restart: always
    # O mongod (PID 1) não faz reap dos `mongosh` do healthcheck — viravam zumbis até esgotar o limite de processos.
    init: true
    # 2026-10-21 — mesmo raciocínio do `mem_limit` do `api` acima. `wiredTigerCacheSizeGB` fixo
    # (em vez do auto-cálculo padrão do WiredTiger, que mira ~50% da RAM "disponível" e pode não
    # enxergar o teto do cgroup corretamente) garante que o mongod nunca tenta crescer o cache
    # além do que o container tem margem pra usar.
    command: ["mongod", "--auth", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
    mem_limit: 350m
    ports: ["27017:27017"]
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: echo 'db.adminCommand("ping")' | mongosh --quiet
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
