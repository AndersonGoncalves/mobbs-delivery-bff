name: Publish Docker image

on:
  push:
    branches:
      - main
  # docs/process/git-workflow.md (mobbs-delivery-app) — builda (sem publicar) em toda PR pra
  # development/main, validando que a imagem Docker/TypeScript compila; o push pro GHCR continua
  # só no evento push (abaixo), nunca em PR.
  pull_request:
    branches:
      - development
      - main
  # specs/0215-ambiente-homologacao REQ-3 — homologação SÓ sob demanda (decisão do usuário,
  # 24/11/2026): botão "Run workflow" na aba Actions escolhendo a branch `development` publica a
  # imagem com a tag `staging` (a que o servidor de homologação usa, `IMAGE_TAG=staging`). Push em
  # development NÃO publica nada (o usuário commita direto nela; não precisa de PR).
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  # specs/0215 — grupo POR BRANCH: com development também publicando, um grupo único fazia um push
  # em development cancelar uma publicação de main em andamento (`cancel-in-progress`).
  group: publish-docker-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/andersongoncalves/mobbs-delivery-bff

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Achado real (16/11/2026) — sem isso, o checkout é raso (profundidade 1) e
          # `git rev-list --count HEAD` abaixo sempre devolve 1, travando BUILD_NUMBER pra sempre
          # em "1" (nunca incrementava de verdade, specs/0200).
          fetch-depth: 0

      - name: Calcular build number (specs/0200)
        run: echo "BUILD_NUMBER=$(git rev-list --count HEAD)" >> "$GITHUB_ENV"

      - name: Write build info (specs/0200)
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cat > src/buildInfo.ts <<EOF
          export const BUILD_VERSION = '${VERSION}+${BUILD_NUMBER}';
          EOF

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # specs/0215 — antes só `push` fazia login/publicava: o "Run workflow" gerava a imagem e nunca
      # a enviava (mesma classe de bug já corrigida nos workflows da web e do app). Botão publica
      # só a partir de main (`latest`) ou development (`staging`).
      - name: Log in to GHCR
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development'))
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          # specs/0215 REQ-3 — `latest` (produção) só de main; `staging` (homologação) só de
          # development; `sha-<commit>` sempre (imutável, pra rollback).
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=staging,enable=${{ github.ref == 'refs/heads/development' }}
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/development')) }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
