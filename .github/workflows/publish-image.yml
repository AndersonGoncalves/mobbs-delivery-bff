name: Publish Docker image

on:
  push:
    branches:
      - main
  # docs/process/git-workflow.md (mobbs-delivery-app) — builda (sem publicar) em toda PR pra
  # development/main, validando que a imagem Docker/TypeScript compila; o push pro GHCR continua
  # só no evento push (abaixo), nunca em PR.
  pull_request:
    branches:
      - development
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-docker-image
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/andersongoncalves/mobbs-delivery-bff

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=long

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
